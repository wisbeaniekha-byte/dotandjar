function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/86400000)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function monthDate(y,m,day){const d=new Date(y,m,1);const yy=d.getFullYear(),mm=d.getMonth();return ds(new Date(yy,mm,Math.min(day,dim(yy,mm))))}
// All dates of a repeating item that fall in [from, to)
function occ(item,from,to){
  const out=[],a=item.anchor,f=item.freq;if(!a||from>=to)return out;
  if(f==='once'){if(a>=from&&a<to)out.push(a);return out}
  if(f==='weekly'||f==='biweekly'){const st=f==='weekly'?7:14;let k=Math.ceil(diffDays(a,from)/st);if(k<0)k=0;
    for(let s=addDays(a,k*st);s<to;s=addDays(s,st))if(s>=from)out.push(s);return out}
  const A=pd(a),day=A.getDate();
  if(f==='semimonthly'){const d2=+item.day2||15,F=pd(from),span=Math.ceil(diffDays(from,to)/28)+2;
    for(let i=-1;i<=span;i++)for(const dd of [day,d2]){const s=monthDate(F.getFullYear(),F.getMonth()+i,dd);if(s>=from&&s<to&&s>=a)out.push(s)}
    return [...new Set(out)].sort()}
  const n=f==='monthly'?1:f==='yearly'?12:Math.max(1,+item.every||1),F=pd(from);
  let k=Math.floor(((F.getFullYear()-A.getFullYear())*12+F.getMonth()-A.getMonth())/n)-1;if(k<0)k=0;
  for(let i=k;i<k+600;i++){const s=monthDate(A.getFullYear(),A.getMonth()+i*n,day);if(s>=to)break;if(s>=from)out.push(s)}
  return out}
function periodDays(it){return {weekly:7,biweekly:14,semimonthly:365/24,monthly:365/12,yearly:365}[it.freq]||(Math.max(1,+it.every||1)*365/12)}
function balanceOf(st){let b=0;for(const e of st.ledger){if(e.t==='set')b=e.amt;else if(e.t==='pay'||e.t==='income')b+=e.amt;else b-=e.amt}return Math.round(b*100)/100}
// Paydays; when a pay is marked "paid early", a Saturday or Sunday payday moves to the Friday before.
function payOcc(p,from,to){if(!p.early)return occ(p,from,to);const out=[];
  for(const d of occ(p,addDays(from,-2),addDays(to,2))){const w=pd(d).getDay(),s=w===6?addDays(d,-1):w===0?addDays(d,-2):d;if(s>=from&&s<to)out.push(s)}return out}
function nextPayday(st,today){let best=null;for(const p of st.pays){const o=payOcc(p,addDays(today,1),addDays(today,400))[0];if(o&&(!best||o<best.date))best={date:o,pay:p}}return best}
function lastPayday(st,today){let best=null;for(const p of st.pays){const o=payOcc(p,addDays(today,-400),addDays(today,1));const l=o[o.length-1];if(l&&(!best||l>best))best=l}return best}
function billKey(b,d){return b.id+'|'+d}
function dueBills(st,today,end){const from=st.start>addDays(today,-14)?st.start:addDays(today,-14);const out=[];
  for(const b of st.bills){if(b.spread&&b.freq!=='once')continue;for(const d of occ(b,from,end))if(!st.paid[billKey(b,d)])out.push({bill:b,date:d,amt:+b.amt})}
  return out.sort((x,y)=>x.date<y.date?-1:1)}
function reserveFor(st,today,daysLeft){let r=0;for(const b of st.bills){if(!b.spread)continue;
  if(b.freq==='once'){const until=diffDays(today,b.anchor);if(until>0&&!st.paid[billKey(b,b.anchor)])r+= +b.amt*Math.min(1,daysLeft/until)}
  else r+= +b.amt/periodDays(b)*daysLeft}return Math.round(r*100)/100}
// Spending caps: money for a category (say Groceries) is held back from the jar for the whole pay period,
// so spending inside the cap never lowers today's number. Spending past the cap does.
function capsFor(st,today,lp){const spends=st.ledger.filter(e=>e.t==='spend');return (st.caps||[]).map(c=>{const amt=+c.amt||0;
  const mine=spends.filter(e=>e.cat===c.cat&&e.date>=lp),spent=mine.reduce((s,e)=>s+e.amt,0),before=mine.filter(e=>e.date<today).reduce((s,e)=>s+e.amt,0),
  todaySpent=spent-before,covered=Math.min(todaySpent,Math.max(0,amt-before));return {cap:c,amt,spent,left:Math.max(0,amt-spent),coveredToday:covered}})}
function calc(st,today){
  const np=nextPayday(st,today),daysLeft=np?Math.max(1,diffDays(today,np.date)):7,end=np?np.date:addDays(today,7);
  const lp=lastPayday(st,today)||st.start;
  const balance=balanceOf(st),due=dueBills(st,today,end),dueTotal=due.reduce((s,x)=>s+x.amt,0),reserve=reserveFor(st,today,daysLeft);
  const caps=capsFor(st,today,lp),capsLeft=caps.reduce((s,c)=>s+c.left,0),covered=caps.reduce((s,c)=>s+c.coveredToday,0);
  const available=Math.round((balance-dueTotal-reserve-capsLeft)*100)/100;
  const spends=st.ledger.filter(e=>e.t==='spend');
  const spentToday=spends.filter(e=>e.date===today).reduce((s,e)=>s+e.amt,0),spentTodayFree=spentToday-covered;
  const perDay=(available+spentTodayFree)/daysLeft, leftToday=perDay-spentTodayFree;
  const spentSince=spends.filter(e=>e.date>=lp).reduce((s,e)=>s+e.amt,0);
  const jar=available<=0?0:available/(available+spentSince);
  const status=available<0?'short':leftToday<=0?'over':leftToday<perDay*0.35?'low':'good';
  return {np,lp,daysLeft,end,balance,due,dueTotal,reserve,caps,capsLeft,available,spentToday,spentTodayFree,perDay,leftToday,jar,status,spentSince}}
// What a spend of x does. Money inside a category's cap comes out of the cap first, not out of today.
function previewSpend(c,x,cat){const cp=cat?c.caps.find(k=>k.cap.cat===cat):null,inCap=cp?Math.min(x,cp.left):0,free=x-inCap;
  return {inCap,leftToday:c.leftToday-free,tomorrow:c.daysLeft>1?(c.available-free)/(c.daysLeft-1):null}}
// Debt payoff: months until every debt is gone, paying minimums plus an extra amount aimed at one debt at a time.
// method 'small' = smallest balance first (snowball), 'rate' = highest interest first (avalanche). null = never shrinks.
function debtPlan(debts,extra,method){const d=debts.filter(x=>+x.bal>0).map(x=>({bal:+x.bal,min:+x.min||0,rate:+x.rate||0}));let m=0;
  while(d.some(x=>x.bal>0.005)){if(++m>600)return null;
    for(const x of d)if(x.bal>0){x.bal+=x.bal*x.rate/1200;x.bal-=Math.min(x.bal,x.min)}
    let pool=(+extra||0)+d.filter(x=>x.bal<=0.005).reduce((s,x)=>s+x.min,0);
    for(const x of d.filter(x=>x.bal>0.005).sort(method==='rate'?(a,b)=>b.rate-a.rate:(a,b)=>a.bal-b.bal)){if(pool<=0)break;const p=Math.min(pool,x.bal);x.bal-=p;pool-=p}}
  return m}
// ---------- CORE-END ----------

function money(n,cents=true){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.currency,minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0}).format(n)}catch(e){return (n<0?'-':'')+'$'+Math.abs(n).toFixed(2)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nice(d){const t=TODAY(),n=diffDays(t,d);if(n===0)return 'today';if(n===1)return 'tomorrow';if(n===-1)return 'yesterday';
  const s=pd(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});return n<0?s+' (late)':s}
function freqLabel(it){return {once:'Just once',weekly:'Every week',biweekly:'Every 2 weeks',semimonthly:'Twice a month',monthly:'Every month',yearly:'Every year',months:'Every '+(it.every||1)+' months'}[it.freq]}
// "1,850" and "1,850.50" are thousands commas; "12,50" and "1.850,50" use a decimal comma
function num(v){let s=String(v).replace(/[^0-9.,-]/g,'');
  if(s.includes('.')&&s.includes(','))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');
  const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN}

// ---------- the jar ----------
// n sweets = days left until payday (one sweet per day). The top sweet is today's; it shrinks as today's money is used.
// gone = how many sweets from the top to show as empty outlines (live preview of a spend).
const JAR_BODY='M44 58 C30 64 22 76 22 96 L22 238 C22 252 32 262 46 262 L194 262 C208 262 218 252 218 238 L218 96 C218 76 210 64 196 58 Z';
function jarSVG(o){const n=Math.max(0,o.n),cap=21,show=Math.min(n,cap),gone=Math.min(o.gone||0,show);
  // fewer days = bigger sweets, so the jar always looks generous
  const r=show<=4?30:show<=7?25:show<=12?20:show<=16?17:15,step=2*r+3,inner=180,left=30,base=258-r,dy=step*.87;
  const per=Math.max(1,Math.floor(inner/step)),pts=[];let i=0,row=0;
  while(i<show){const odd=row%2===1,cnt=Math.min(odd?per-1||1:per,show-i),w=(cnt-1)*step,x0=left+(inner-w)/2;
    for(let c=0;c<cnt&&i<show;c++,i++)pts.push([x0+c*step,base-row*dy]);row++}
  let sweets='';pts.forEach((p,k)=>{const col=SWEETS[k%4],fromTop=show-1-k,isTop=fromTop===0,frac=isTop?Math.max(.2,Math.min(1,o.todayFrac??1)):1,out=fromTop<gone;
    sweets+='<g class="sw'+(out?' gone':'')+(isTop?' today-sweet':'')+'" data-k="'+fromTop+'"'+(isTop?' style="transform:scale('+frac.toFixed(3)+')"':'')+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="var(--'+col+')"/>'+
      '<circle cx="'+(p[0]-r*.35)+'" cy="'+(p[1]-r*.35)+'" r="'+(r*.28)+'" fill="#fff" opacity=".55"/></g>'+
      (isTop?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(r+4)+'" fill="none" stroke="var(--ink)" stroke-width="2.5"/>':'')});
  const more=n>cap?'<text x="120" y="'+(base-row*dy-r)+'"text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="18" fill="var(--ink)">+'+(n-cap)+' more days</text>':'';
  const label=o.label||('Money jar: '+n+' '+(n===1?'day':'days')+' of money until payday');
  return '<svg class="'+(o.cls||'jar')+'" viewBox="0 0 240 272" role="img" aria-label="'+esc(label)+'">'+
   '<defs><clipPath id="jc'+(o.id||'')+'"><path d="'+JAR_BODY+'"/></clipPath></defs>'+
   '<rect x="50" y="18" width="140" height="30" rx="10" fill="var(--ink)"/><rect x="58" y="44" width="124" height="16" rx="4" fill="var(--ink)" opacity=".85"/>'+
   '<path d="'+JAR_BODY+'" fill="var(--glass)" stroke="var(--ink)" stroke-width="3"/><rect x="44" y="60" width="152" height="10" rx="5" fill="none" stroke="var(--rim)" stroke-width="3"/>'+
   '<g clip-path="url(#jc'+(o.id||'')+')">'+sweets+'</g>'+more+
   '<path d="M38 104 C36 140 36 190 40 226" fill="none" stroke="var(--glass-hi)" stroke-width="9" stroke-linecap="round"/><path d="M38 104 C36 140 36 190 40 226" fill="none" stroke="var(--rim)" stroke-width="1.5" stroke-linecap="round" transform="translate(7 0)"/>'+
   '<path d="'+JAR_BODY+'" fill="none" stroke="var(--ink)" stroke-width="3"/></svg>'}
function markSVG(){return '<svg viewBox="0 0 26 26" aria-hidden="true"><rect x="7" y="2" width="12" height="4" rx="1.5" fill="var(--ink)"/><path d="M8 7c-3 1-4 3-4 6v7a3 3 0 003 3h12a3 3 0 003-3v-7c0-3-1-5-4-6z" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="10" cy="17" r="2.6" fill="var(--rasp)"/><circle cx="16" cy="16" r="2.6" fill="var(--lemon)"/></svg>'}

      '<div class="chips">'+quick.map(q=>'<button type="button" class="chip" data-qb="'+q+'" aria-pressed="'+d.bills.some(b=>b.name===q)+'">'+q+'</button>').join('')+'</div>'+
      d.bills.map((b,i)=>'<div class="field"><span class="lab">'+esc(b.name)+'</span><div class="row" style="flex-wrap:nowrap"><input type="text" inputmode="decimal" class="num" data-ba="'+i+'" value="'+b.amt+'" placeholder="Amount" style="flex:1;min-width:0" aria-label="'+esc(b.name)+' amount"><input type="date" data-bd="'+i+'" value="'+b.date+'" style="flex:1.4;min-width:0" aria-label="'+esc(b.name)+' due date"></div></div>').join('');
    sheet(steps+body+'<p class="small" id="werr" role="alert"></p><div class="row">'+(step>1?'<button class="btn" type="button" id="wback">Back</button>':'<button class="btn" type="button" data-close>Not now</button>')+'<button class="btn ink" type="button" id="wnext" style="flex:1">'+(step<3?'Next':'Fill my jar')+'</button></div>',L=>{wireClose(L);
      const err=t=>L.querySelector('#werr').textContent=t,grab=()=>{
        if(step===1){d.bal=L.querySelector('#wb').value;d.currency=L.querySelector('#wc').value}
        if(step===2){d.payAmt=L.querySelector('#wpa').value;d.payFreq=L.querySelector('#wpf').value;d.payDate=L.querySelector('#wpd').value}
        if(step===3){L.querySelectorAll('[data-ba]').forEach(i=>d.bills[+i.dataset.ba].amt=i.value);L.querySelectorAll('[data-bd]').forEach(i=>d.bills[+i.dataset.bd].date=i.value)}};
      L.querySelectorAll('[data-qb]').forEach(b=>b.onclick=()=>{grab();const q=b.dataset.qb,i=d.bills.findIndex(x=>x.name===q);if(i>=0)d.bills.splice(i,1);else d.bills.push({name:q,amt:'',date:addDays(TODAY(),3)});draw()});
      const back=L.querySelector('#wback');if(back)back.onclick=()=>{grab();step--;draw()};
      L.querySelector('#wnext').onclick=()=>{grab();
        if(step===1&&!isFinite(num(d.bal)))return err('Type your balance, like 640.');
        if(step===2&&d.payAmt&&!(num(d.payAmt)>0))return err('Type the amount, or leave it empty to skip.');
        if(step<3){step++;return draw()}
        const prefs=S.prefs;S=emptyState(d.name,d.currency);S.prefs=prefs;S.ledger.push({id:uid(),t:'set',amt:num(d.bal),date:TODAY(),ts:Date.now()});
        if(num(d.payAmt)>0)S.pays.push({id:uid(),name:'Pay',amt:num(d.payAmt),freq:d.payFreq,anchor:d.payDate||addDays(TODAY(),7)});
        for(const b of d.bills)if(num(b.amt)>0)S.bills.push({id:uid(),name:b.name,amt:num(b.amt),freq:'monthly',anchor:b.date||addDays(TODAY(),3)});
        save();close();tab='today';render();window.scrollTo(0,0);track('demo_setup_done');toast('Your jar is filled. This is your real number now.')}})};draw()}

function goalForm(){sheet(sheetHead('Add a savings goal')+'<div class="field"><label for="gn">What for?</label><input type="text" id="gn" placeholder="Holiday, emergency fund" autofocus></div><div class="field"><label for="gt">Target</label><input type="text" inputmode="decimal" id="gt" class="num"></div><p class="small" id="gerr" role="alert"></p><button class="btn ink big wide" type="button" id="gs">Save</button>',L=>{wireClose(L);
  L.querySelector('#gs').onclick=()=>{const name=L.querySelector('#gn').value.trim(),t=num(L.querySelector('#gt').value);if(!name||!(t>0)){L.querySelector('#gerr').textContent='Add a name and a target amount.';return}S.goals.push({id:uid(),name,target:t,saved:0});save();close();render()}})}

// ---------- events ----------
function bind(c,root){const A=root||document.getElementById('app');
  const on=(sel,fn)=>A.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
  on('[data-act]',el=>{const a=el.dataset.act;
    if(a==='add')addSpend();
    if(a==='how'){ui.how=!ui.how;render()}
    if(a==='focus'){S.prefs.focus=!S.prefs.focus;save();render()}
    if(a==='setup')setupWizard(); if(a==='balance')setBalance(); if(a==='awayok'){ui.awayDone=true;render()}
    if(a==='settings')settingsSheet(); if(a==='oops')oopsSheet(); if(a==='addcap')capForm(); if(a==='adddebt')debtForm(); if(a==='csv')exportCSV();
    if(a==='startdone'){S.startDone=true;save();render()}
    if(a==='dumpadd'){const i=document.getElementById('dumpIn');const v=i&&i.value.trim();if(v){S.dump.push({id:uid(),text:v,ts:Date.now()});save();render();const n=document.getElementById('dumpIn');n&&n.focus()}}
    if(a==='addbill')itemForm('bill'); if(a==='addpay')itemForm('pay'); if(a==='addpause')addPause(); if(a==='addgoal')goalForm();
    if(a==='backup'){try{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;S.backedUp=true;save();l.download='dot-and-jar-backup-'+TODAY()+'.json';document.body.appendChild(l);l.click();l.remove();toast('Backup saved to your downloads.')}catch(e){toast('Could not save here. Try in Chrome or Safari.')}}
    if(a==='wipe'){document.getElementById('wipeConfirm').innerHTML='<div class="note warm"><p><b>Erase everything on this phone?</b> This cannot be undone. Save a backup first if you might want it.</p><div class="row"><button class="btn danger" type="button" id="wipeYes">Yes, erase</button><button class="btn" type="button" id="wipeNo">Keep my numbers</button></div></div>';
      document.getElementById('wipeYes').onclick=()=>{const prefs=S.prefs;S=exampleState();S.prefs=prefs;save();tab='today';render();toast('Erased. Showing example numbers.')};document.getElementById('wipeNo').onclick=()=>document.getElementById('wipeConfirm').innerHTML=''}});
  on('[data-tabgo]',el=>{tab=el.dataset.tabgo;window.scrollTo(0,0);render()});
  on('[data-del]',el=>{const snap=snapshot();S.ledger=S.ledger.filter(e=>e.id!==el.dataset.del);save();render();toast('Spend deleted.',()=>restore(snap))});
  on('[data-paid]',el=>{const k=el.dataset.paid,[id]=k.split('|'),b=S.bills.find(x=>x.id===id);if(!b)return;
    const debt=b.debtId?S.debts.find(d=>d.id===b.debtId):null;
    if(S.paid[k]){S.ledger=S.ledger.filter(e=>e.id!==S.paid[k]);delete S.paid[k];if(debt)debt.bal=Math.round((+debt.bal+(+b.amt))*100)/100;save();render();return}
    const lid=uid();S.ledger.push({id:lid,t:'bill',amt:+b.amt,date:TODAY(),ts:Date.now(),note:b.name});S.paid[k]=lid;if(debt)debt.bal=Math.max(0,Math.round((+debt.bal-(+b.amt))*100)/100);save();render();toast(b.name+' paid. One less thing.')});
  on('[data-editbill]',el=>itemForm('bill',S.bills.find(x=>x.id===el.dataset.editbill)));
  on('[data-editpay]',el=>itemForm('pay',S.pays.find(x=>x.id===el.dataset.editpay)));
  on('[data-pay]',el=>{const k=el.dataset.pay,p=S.pays.find(x=>x.id===k.split('|')[0]);S.ledger.push({id:uid(),t:'pay',amt:+p.amt,date:TODAY(),ts:Date.now()});S.payOk[k]=1;save();render();toast('Payday added. The jar is full again.')});
  on('[data-payamt]',el=>{const k=el.dataset.payamt;askNumber('How much arrived?','','Amount that arrived','',x=>{S.ledger.push({id:uid(),t:'pay',amt:x,date:TODAY(),ts:Date.now()});S.payOk[k]=1;save();toast('Payday added.')})});
  on('[data-payno]',el=>{S.payOk[el.dataset.payno]=1;save();render()});
  on('[data-buy]',el=>{const p=S.pauses.find(x=>x.id===el.dataset.buy);S.ledger.push({id:uid(),t:'spend',amt:p.amt,cat:'Fun',note:p.item,date:TODAY(),ts:Date.now()});S.pauses=S.pauses.filter(x=>x!==p);save();render();toast('Bought and logged. You thought it through.')});
  on('[data-letgo]',el=>{const p=S.pauses.find(x=>x.id===el.dataset.letgo);S.kept=Math.round((S.kept+p.amt)*100)/100;S.letGo=(S.letGo||0)+1;S.pauses=S.pauses.filter(x=>x!==p);save();render();toast(money(p.amt)+' kept. That is real money.')});
  on('[data-addgoal]',el=>{const g=S.goals.find(x=>x.id===el.dataset.addgoal);askNumber('Put money into '+esc(g.name),'This takes it out of the jar.','Amount','',x=>{g.saved=Math.round((g.saved+x)*100)/100;S.ledger.push({id:uid(),t:'save',amt:x,date:TODAY(),ts:Date.now(),note:g.name});save();toast('Saved toward '+g.name+'.')})});
  on('[data-delgoal]',el=>{const snap=snapshot();S.goals=S.goals.filter(g=>g.id!==el.dataset.delgoal);save();render();toast('Goal removed.',()=>restore(snap))});
  on('[data-pref]',el=>{S.prefs[el.dataset.pref]=el.dataset.val;save();render();el.parentNode.querySelectorAll('[data-pref]').forEach(x=>x.setAttribute('aria-pressed',x===el))});
  const sw=(id,k)=>{const e=document.getElementById(id);if(e)e.onchange=()=>{S.prefs[k]=e.checked;save();render()}};sw('calm','calm');sw('motion','motion');sw('focusSw','focus');
  const nm=document.getElementById('nm');if(nm)nm.onchange=()=>{S.name=nm.value.trim();save()};
  const cur=document.getElementById('cur');if(cur)cur.onchange=()=>{S.currency=cur.value;save();render()};
  on('[data-billmode]',el=>{ui.billMode=el.dataset.billmode;render()});
  on('[data-monthoff]',el=>{ui.monthOff=(ui.monthOff||0)+(+el.dataset.monthoff);ui.calDay=null;render()});
  on('[data-calday]',el=>{ui.calDay=el.dataset.calday;render()});
  on('[data-editcap]',el=>capForm(S.caps.find(k=>k.id===el.dataset.editcap)));
  on('[data-method]',el=>{S.method=el.dataset.method;save();render()});
  on('[data-editdebt]',el=>debtForm(S.debts.find(d=>d.id===el.dataset.editdebt)));
  on('[data-debtpay]',el=>{const d=S.debts.find(x=>x.id===el.dataset.debtpay);askNumber('Pay toward '+esc(d.name),'This comes out of your account and lowers what you owe.','Amount',d.min||'',x=>{d.bal=Math.max(0,Math.round((+d.bal-x)*100)/100);S.ledger.push({id:uid(),t:'bill',amt:x,date:TODAY(),ts:Date.now(),note:d.name});save();toast(d.bal>0?'Payment saved. '+money(d.bal)+' to go.':d.name+' is paid off. Huge.')})});
  on('[data-dumpdel]',el=>{const snap=snapshot();S.dump=S.dump.filter(n=>n.id!==el.dataset.dumpdel);save();render();toast('Cleared.',()=>restore(snap))});
  const ex=A.querySelector('#extra');if(ex)ex.onchange=()=>{const v=num(ex.value);S.extra=v>0?v:0;save();render()};
  const di=A.querySelector('#dumpIn');if(di)di.onkeydown=e=>{if(e.key==='Enter'){const v=di.value.trim();if(v){S.dump.push({id:uid(),text:v,ts:Date.now()});save();render();const n=document.getElementById('dumpIn');n&&n.focus()}}};
  const rf=document.getElementById('restoreFile');if(rf)rf.onchange=()=>{const f=rf.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.ledger||!o.bills)throw 0;S=o;save();tab='today';render();toast('Backup opened.')}catch(e){toast('That file is not a Dot & Jar backup.')}};r.readAsText(f)}}
document.getElementById('fab').onclick=addSpend;
const hashTab=location.hash.slice(1).split('-');if(['today','bills','pause','plan'].includes(hashTab[0])){tab=hashTab[0];if(hashTab[1]==='month')ui.billMode='month'}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
